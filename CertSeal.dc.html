<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;line-height:0;display:flex;align-items:center;justify-content:center;">{{ seal }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:180},&quot;logo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;VF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vision&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Framer&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#94765a&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const logo = this.props.logo ?? '';
    const initials = this.props.initials ?? '';
    if (logo) {
      const circle = !!(this.props.circle && this.props.circle !== 'false');
      const img = h('img', { src: logo, alt: (initials || 'Certification') + ' official logo',
        style: circle
          ? { width: '100%', height: '100%', objectFit: 'cover', borderRadius: '50%', display: 'block' }
          : { maxWidth: '86%', maxHeight: '86%', objectFit: 'contain', display: 'block' } });
      return { seal: img };
    }
    const ring = this.props.ring ?? '#94765a';
    const field = this.props.field ?? '#faf8f3';
    const ink = this.props.ink ?? '#1e1d1b';
    const muted = this.props.muted ?? '#6e6a62';
    const line1 = (this.props.line1 ?? '').toUpperCase();
    const line2 = (this.props.line2 ?? '').toUpperCase();
    const diamond = (cx, cy) => h('rect', { x: cx - 2.5, y: cy - 2.5, width: 5, height: 5, transform: `rotate(45 ${cx} ${cy})` });
    const seal = h('svg', { viewBox: '0 0 200 200', style: { width: '100%', height: '100%', display: 'block', overflow: 'visible' } },
      h('circle', { cx: 100, cy: 100, r: 95, fill: field, stroke: ring, strokeWidth: 1.5 }),
      h('circle', { cx: 100, cy: 100, r: 82, fill: 'none', stroke: ring, strokeWidth: 0.8 }),
      h('g', { fill: ring }, diamond(100, 16.5), diamond(100, 183.5), diamond(16.5, 100), diamond(183.5, 100)),
      h('text', { x: 100, y: 99, textAnchor: 'middle', fontFamily: "'Cormorant Garamond',serif", fontWeight: 600, fontSize: 60, fill: ring }, initials),
      h('text', { x: 100, y: 128, textAnchor: 'middle', fontFamily: "'Instrument Sans',sans-serif", fontWeight: 600, fontSize: 12.5, letterSpacing: 2.5, fill: ink }, line1),
      h('text', { x: 100, y: 144, textAnchor: 'middle', fontFamily: "'Instrument Sans',sans-serif", fontWeight: 500, fontSize: 9.5, letterSpacing: 3.5, fill: muted }, line2),
    );
    return { seal };
  }
}
</script>
</body>
</html>
